<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0A;
    --panel: #141414;
    --panel-line: #232323;
    --ink: #F2F2F0;
    --dim: #4E4E4B;
    --accent: #FF4B2B;
    --font-display: 'Rajdhani', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
 
  *{ box-sizing: border-box; }
 
  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display), sans-serif;
    -webkit-font-smoothing: antialiased;
  }
 
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: clamp(2.5rem, 7vw, 5rem) clamp(1.1rem, 4vw, 2rem) 4rem;
    position: relative;
    overflow-x: hidden;
  }
 
  /* bezel de montre en filigrane */
  body::before{
    content:"";
    position: fixed;
    top: 50%; left: 50%;
    width: 1100px; height: 1100px;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    border: 1px solid rgba(255,75,43,0.05);
    box-shadow: 0 0 0 60px rgba(255,255,255,0.012), 0 0 0 120px rgba(255,255,255,0.008);
    pointer-events: none;
    z-index: 0;
  }
 
  .page{ width: 100%; max-width: 620px; position: relative; z-index: 1; }
 
  h1{
    font-weight: 700;
    font-size: clamp(3rem, 9vw, 5rem);
    letter-spacing: 0.06em;
    margin: 0 0 clamp(2rem, 5vw, 3rem);
    line-height: 0.95;
    text-align: center;
  }
  h1 span{ color: var(--accent); }
 
  .links{
    display: grid;
    gap: 1px;
    background: var(--panel-line);
    border: 1px solid var(--panel-line);
  }
  .link-card{
    background: var(--panel);
    padding: 1.2rem 1.4rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    text-decoration: none;
    color: var(--ink);
    transition: background 0.15s ease;
  }
  .link-card:hover{ background: #1a1a1a; }
  .link-card svg{ width: 26px; height: 26px; color: var(--accent); flex: none; }
  .link-card .t{
    flex: 1;
    min-width: 0;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .link-card .go{
    flex: none;
    font-family: var(--font-mono);
    font-size: 1.1rem;
    color: var(--dim);
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .link-card:hover .go{ color: var(--accent); transform: translateX(3px); }
</style>
</head>
<body>
 
<div class="page">
  <h1>ATH<span>LON</span></h1>
 
  <nav class="links">
    <a class="link-card" href="carnet.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M16 3v3h3M8 10h8M8 13.5h8M8 17h5"/></svg>
      <span class="t">Carnet de course et entraînements</span>
      <span class="go">→</span>
    </a>
 
    <a class="link-card" href="materiel.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3L5.6 5.6"/></svg>
      <span class="t">Matériel</span>
      <span class="go">→</span>
    </a>
 
    <a class="link-card" href="entrainements.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="4.5" r="1.6"/><path d="M9 21l2.5-5 3-2-1-4-3.5 1-2-3M12 14l3 1 3 5"/></svg>
      <span class="t">Entraînements</span>
      <span class="go">→</span>
    </a>
 
    <a class="link-card" href="https://jsilobre.github.io/spot-fractionne/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
      <span class="t">Outil Spots</span>
      <span class="go">↗</span>
    </a>
 
    <a class="link-card" href="https://app.sisyf.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V5M4 20h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span class="t">Outil Plan de course</span>
      <span class="go">↗</span>
    </a>
 
    <a class="link-card" href="https://www.strava.com/athletes/49995193" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20l5-10 5 10M12 10l-3-6-4 8"/></svg>
      <span class="t">Strava</span>
      <span class="go">↗</span>
    </a>
  </nav>
</div>
 
</body>
</html>
